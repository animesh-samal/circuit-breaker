# Release. Triggered only by a semantic version tag.
#
# main being green does not deploy anything -- publishing is a deliberate act,
# marked by `git tag v1.2.3 && git push --tags`. That separation is what makes a
# rollback meaningful: every deploy corresponds to exactly one immutable tag.
#
# No AWS credentials are stored anywhere. GitHub mints a short-lived OIDC token
# describing this repository and this workflow; AWS verifies it against GitHub's
# public keys and issues temporary credentials scoped to the deploy role.

name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false # never cancel a deploy midway

permissions:
  contents: read
  id-token: write # required for OIDC; without it the token is never issued

env:
  AWS_REGION: ap-south-1
  PROJECT: circuit-breaker

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # gives you a place to add manual approval later

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}/api:${{ steps.v.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            GIT_TAG=${{ steps.v.outputs.tag }}
            BUILD_TIME=${{ steps.v.outputs.iso }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}/web:${{ steps.v.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            GIT_TAG=${{ steps.v.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The node is found by tag rather than by a stored instance ID, so
      # replacing it does not require touching repository settings.
      - name: Find the node
        id: node
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=${PROJECT}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "no running node found for project ${PROJECT}" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.node.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "release ${TAG}" \
            --parameters "commands=[
              'set -euo pipefail',
              'if [ ! -d /opt/${PROJECT}/.git ]; then git clone -q ${REPO_URL} /opt/${PROJECT}; fi',
              'cd /opt/${PROJECT}',
              'git fetch -q --all --tags --prune',
              'git checkout -q --force ${TAG}',
              'chmod +x deploy/scripts/deploy.sh',
              'bash deploy/scripts/deploy.sh ${TAG} ${REGISTRY}'
            ]" \
            --query Command.CommandId --output text)

          echo "command $CMD_ID"

          # `wait` polls for up to ~10 minutes and returns non-zero on failure.
          # Doing this by hand with sleep loops is where flaky pipelines come from.
          if ! aws ssm wait command-executed \
                --command-id "$CMD_ID" \
                --instance-id "${{ steps.node.outputs.id }}"; then
            echo "::error::deploy command failed"
          fi

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.node.outputs.id }}" \
            --query 'StandardOutputContent' --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.node.outputs.id }}" \
            --query 'Status' --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ steps.node.outputs.id }}" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      # Written whether the deploy succeeded or failed. A history that only
      # records successes is a history that lies about your failure rate, which
      # is the number you most want when something breaks at 2am.
      - name: Record the deploy
        if: always()
        run: |
          ENDED=$(date -u +%s)
          DURATION=$(( ENDED - ${{ steps.v.outputs.started }} ))
          STATUS="${{ steps.deploy.outcome == 'success' && 'success' || 'failed' }}"

          aws dynamodb put-item \
            --table-name "${PROJECT}-deploys" \
            --item "{
              \"pk\":              {\"S\": \"deploy\"},
              \"sk\":              {\"S\": \"${{ steps.v.outputs.iso }}\"},
              \"git_sha\":         {\"S\": \"${{ steps.v.outputs.sha }}\"},
              \"git_tag\":         {\"S\": \"${{ steps.v.outputs.tag }}\"},
              \"actor\":           {\"S\": \"${GITHUB_ACTOR}\"},
              \"started_at\":      {\"S\": \"${{ steps.v.outputs.iso }}\"},
              \"duration_seconds\":{\"N\": \"${DURATION}\"},
              \"status\":          {\"S\": \"${STATUS}\"},
              \"environment\":     {\"S\": \"prod\"}
            }"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.v.outputs.tag }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.v.outputs.sha }}\` |"
            echo "| Result | ${{ steps.deploy.outcome }} |"
            echo "| Site | http://3.111.200.165 |"
          } >> "$GITHUB_STEP_SUMMARY"

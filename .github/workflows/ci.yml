# Quality gates. Runs on every pull request and on main.
#
# Nothing here touches AWS and nothing here deploys -- this workflow needs no
# credentials at all, which is why its permissions are read-only. Releasing is a
# separate workflow triggered by a tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs are pointless. Pushing three times in a minute should leave
# one run in flight, not three competing for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Monorepo path filtering. Without this, a README edit rebuilds and retests
  # everything. Each downstream job checks its own flag and skips otherwise.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'terraform/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        run: pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree. `install` would
      # silently resolve new versions, so CI could pass against dependencies
      # that never existed on anyone's machine.
      - run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Secret scanning runs on everything, always. It is the one check whose value
  # comes from never being skipped.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Images are built on PRs but never pushed. Catches a broken Dockerfile before
  # merge without publishing anything.
  images:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: circuit-breaker/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: circuit-breaker/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Trivy runs from its official image rather than the marketplace action.
      # Two reasons:
      #
      #   1. One fewer third-party action in the supply chain. An action runs
      #      arbitrary code with the workflow's token; the image only reads a
      #      tarball we hand it.
      #   2. The action's release tags move around and pinning them is a
      #      recurring source of "unable to resolve action" failures.
      #
      # Images are exported with `docker save` and scanned via --input, so the
      # Docker socket is never mounted into the scanner. Handing the socket to a
      # container is equivalent to giving it root on the host, and there is no
      # reason a vulnerability scanner needs that.
      #
      # The scanner itself is deliberately unpinned. Pinning is usually correct,
      # but a scanner's value is entirely in being current -- last year's
      # scanner with last year's database finds last year's vulnerabilities.
      - name: Scan images
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/scan

          scan() {
            local image="$1" name="$2"
            docker save "$image" -o "/tmp/scan/${name}.tar"
            docker run --rm -v /tmp/scan:/scan aquasec/trivy:latest image \
              --input "/scan/${name}.tar" \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress
          }

          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            scan circuit-breaker/api:ci api
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            scan circuit-breaker/web:ci web
          fi

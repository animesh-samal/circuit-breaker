worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs to stdout so the container runtime collects them. Writing to a file
  # inside a container means the logs die with the pod.
  access_log /dev/stdout;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

  # Running as a non-root user means nginx cannot write to its default temp
  # paths under /var/cache/nginx. Point them at /tmp, which is writable.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached
    # forever. index.html must never be cached, or a returning visitor keeps
    # loading the old bundle after a deploy.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container-level health. The Ingress routes /api to the backend, so this
    # never collides with the API's own probes.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # SPA fallback. Client-side routes like /blog/why-k3s-not-eks do not exist
    # on disk; without this, a refresh on any route below / returns 404.
    location / {
      try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-breaker-web
  namespace: circuit-breaker
  labels:
    app.kubernetes.io/name: circuit-breaker-web
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: circuit-breaker-web

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: circuit-breaker-web
        app.kubernetes.io/name: circuit-breaker-web
    spec:
      serviceAccountName: circuit-breaker-web
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the nginx user in the alpine image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: REPLACED_BY_CI
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          # Static files. An order of magnitude cheaper than the API, and it
          # should be sized that way -- reserving what it does not need would
          # starve the API on a 1 GiB node.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: circuit-breaker-web
  namespace: circuit-breaker
spec:
  type: ClusterIP
  selector:
    app: circuit-breaker-web
  ports:
    - name: http
      port: 80
      targetPort: http
